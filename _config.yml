title: MapRVA
copyright: MapRVA
description: >- # this means to ignore newlines until "baseurl:"
  We are a group of mapping enthusiasts in Richmond, Virginia who work
  to create and share geospatial data of our city using OpenStreetMap.
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://localhost:8000" # PLEASE DO NOT EDIT, this is set to https://maprva.org using _config-publish.yml
logo: /img/logo.svg
logo_mono: /img/logo-mono.svg
date_format: "%b %-d, %Y"
calendar: https://calendar.google.com/calendar/embed?src=mappingrva%40gmail.com&ctz=America%2FNew_York
github: MapRVA
mastodon: https://en.osm.town/@maprva
bluesky: false
youtube_page: false
instagram: false
twitter: false
facebook: false
linkedin: false
slack_page: /slack
links:
  - link: /about/
  - link: /get-involved/
  - link: /projects/
  - link: /resources/
  # - link: /member-projects/
  # - link: /blog/

# Build settings
plugins:
  - jekyll-feed
  - jekyll-copyr
  - jekyll-archives
  - jekyll-include-cache

exclude:
  - DEVELOPMENT.md
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yml

jekyll-copyr:
  tasks:
    - from: "./_ultra-maps/."
      to: "./_site/ultra-maps/"

jekyll-archives:
  enabled:
    - year
    - month
    - tags
  layouts:
    year: archives/posts-year
    month: archives/month
    tag: archives/posts-tag
  permalinks:
    year: '/:year/'
    month: '/:year/:month/'
    tag: '/tags/:name/'

collections:
  feeds:
    output: true
  pages:
    output: true
  projects:
    output: true
  people:
    output: true
  posts:
    output: true
  redirects:
    output: true
  ultra-maps:
    output: false
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      permalink: /:path/
      layout: "page"
  - scope:
      path: "_redirects"
      type: "redirects"
    values:
      permalink: /:path/
      layout: "redirect"
  - scope:
      path: "_people"
      type: "people"
    values:
      layout: "person"
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: project
  - scope:
      path: "_posts/blog"
      type: "posts"
    values:
      permalink: /blog/:year/:month/:title/
      category: "Blog"
      layout: "post"
